<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Expediente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header a {
            color: #667eea;
            text-decoration: none;
            margin-bottom: 20px;
            display: inline-block;
        }

        .header h1 { color: #1a3a52; margin: 20px 0 10px; }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .section h2 { color: #1a3a52; margin-bottom: 20px; font-size: 18px; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #1a3a52;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.activo { background: #d1fae5; color: #065f46; }
        .badge.resuelto { background: #dbeafe; color: #1e40af; }
        .badge.apelacion { background: #fef3c7; color: #92400e; }
        .badge.archivado { background: #f3f4f6; color: #374151; }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            background: #f3f4f6;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        .table tr:hover { background: #f9fafb; }

        .movimiento {
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f9fafb;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        .movimiento-tipo {
            font-weight: 600;
            color: #1a3a52;
            text-transform: uppercase;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .movimiento-fecha {
            color: #666;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .movimiento-descripcion {
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }

        .loading { text-align: center; padding: 40px; color: #666; }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .info-grid { grid-template-columns: 1fr; }
            .table { font-size: 12px; }
            .table th, .table td { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/expedientes">← Volver a Expedientes</a>
            <div id="titulo" class="loading">
                <div class="spinner"></div>
                Cargando...
            </div>
        </div>

        <div class="section" id="detalles">
            <div class="loading">
                <div class="spinner"></div>
                Cargando detalles...
            </div>
        </div>

        <div class="section">
            <h2>📝 Historial de Movimientos</h2>
            <div id="movimientos">
                <div class="loading">
                    <div class="spinner"></div>
                    Cargando movimientos...
                </div>
            </div>
        </div>
    </div>

    <script>
        const numeroExpediente = new URLSearchParams(window.location.search).get('numero') ||
            window.location.pathname.split('/').pop();

        async function cargarDetalle() {
            try {
                const response = await fetch(`/api/expedientes/${encodeURIComponent(numeroExpediente)}`);
                const data = response.json();

                // Wait for data
                Promise.resolve(data).then(result => {
                    if (result.exito && result.datos) {
                        mostrarDetalle(result.datos);
                    } else {
                        document.getElementById('detalles').innerHTML =
                            `<div style="color: red;">Expediente no encontrado</div>`;
                    }
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('detalles').innerHTML =
                    `<div style="color: red;">Error cargando expediente</div>`;
            }

            // Cargar movimientos
            cargarMovimientos();
        }

        function mostrarDetalle(exp) {
            const badge = `<span class="badge ${exp.estado}">${exp.estado}</span>`;

            const html = `
                <h1>${exp.numeroExpediente}</h1>
                <p style="color: #666; margin: 10px 0 20px;">
                    <strong>${exp.caratula}</strong>
                </p>

                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Estado</div>
                        <div class="info-value">${badge}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Demandante</div>
                        <div class="info-value">${exp.demandante}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Demandado</div>
                        <div class="info-value">${exp.demandado}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Juez</div>
                        <div class="info-value">${exp.juez}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Juzgado</div>
                        <div class="info-value">${exp.juzgado}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Ciudad</div>
                        <div class="info-value">${exp.ciudad}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Fecha Radicación</div>
                        <div class="info-value">${new Date(exp.fechaRadicacion).toLocaleDateString('es-DO')}</div>
                    </div>
                    ${exp.proximaAudiencia ? `
                    <div class="info-item">
                        <div class="info-label">Próxima Audiencia</div>
                        <div class="info-value">${new Date(exp.proximaAudiencia).toLocaleDateString('es-DO')}</div>
                    </div>
                    ` : ''}
                    <div class="info-item">
                        <div class="info-label">Total Movimientos</div>
                        <div class="info-value">${exp.movimientos.length}</div>
                    </div>
                </div>
            `;

            document.getElementById('detalles').innerHTML = html;
            document.getElementById('titulo').innerHTML = `
                <h1>${exp.numeroExpediente}</h1>
                <p style="color: #666;">${exp.caratula.substring(0, 60)}...</p>
            `;
        }

        async function cargarMovimientos() {
            try {
                const response = await fetch(`/api/expedientes/${encodeURIComponent(numeroExpediente)}/movimientos`);
                const data = await response.json();

                if (data.exito && data.datos) {
                    mostrarMovimientos(data.datos);
                }
            } catch (error) {
                console.error('Error cargando movimientos:', error);
            }
        }

        function mostrarMovimientos(movimientos) {
            if (movimientos.length === 0) {
                document.getElementById('movimientos').innerHTML =
                    '<p style="color: #999;">No hay movimientos registrados</p>';
                return;
            }

            let html = '';
            movimientos.forEach(mov => {
                const fecha = new Date(mov.fecha).toLocaleDateString('es-DO');
                html += `
                    <div class="movimiento">
                        <div class="movimiento-tipo">${mov.tipo}</div>
                        <div class="movimiento-fecha">${fecha}</div>
                        <div class="movimiento-descripcion">${mov.descripcion}</div>
                        ${mov.juez ? `<div style="font-size: 12px; color: #666; margin-top: 8px;">Juez: ${mov.juez}</div>` : ''}
                        ${mov.numeroAuto ? `<div style="font-size: 12px; color: #666;">Auto: ${mov.numeroAuto}</div>` : ''}
                    </div>
                `;
            });

            document.getElementById('movimientos').innerHTML = html;
        }

        // Cargar al abrir
        cargarDetalle();
    </script>
</body>
</html>
